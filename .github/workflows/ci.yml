name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Formatação, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build de produção
        run: npm run build
        env:
          VITE_SITE_URL: https://example.com
      - name: Nenhum segredo no build público
        run: npm run secrets:check

  segredos:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # histórico completo: um segredo apagado depois continua exposto nos commits antigos
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Gitleaks (todo o histórico)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose
      - name: Arquivos .env e chaves do Supabase versionados
        run: node scripts/check-secrets.mjs
      - name: Vulnerabilidades nas dependências de produção
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Tipos do banco e testes E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: qualidade
    defaults:
      run:
        working-directory: la-dolce-app
    steps:
      - name: Token de leitura dos repositórios la-dolce-*
        working-directory: .
        env:
          TOKEN: ${{ secrets.LA_DOLCE_REPOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Crie o secret LA_DOLCE_REPOS_TOKEN na organização (veja o README do la-dolce-api)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          path: la-dolce-app
      - name: Banco (la-dolce-api)
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/la-dolce-api
          token: ${{ secrets.LA_DOLCE_REPOS_TOKEN }}
          path: la-dolce-api
      - name: Seed e imagens (la-dolce-data)
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/la-dolce-data
          token: ${{ secrets.LA_DOLCE_REPOS_TOKEN }}
          path: la-dolce-data
      - uses: actions/setup-node@v5
        with:
          node-version-file: la-dolce-app/.nvmrc
          cache: npm
          cache-dependency-path: |
            la-dolce-app/package-lock.json
            la-dolce-api/package-lock.json
      - name: Tipos do banco iguais aos do la-dolce-api
        run: |
          if ! diff -u src/types/database.ts ../la-dolce-api/types/database.ts; then
            echo "::error::src/types/database.ts difere do la-dolce-api. Rode npm run types:sync e faça commit."
            exit 1
          fi
      - run: npm ci
      - run: npm ci
        working-directory: la-dolce-api
      - name: Supabase local (migrations + seed)
        working-directory: la-dolce-api
        run: npx supabase start -x studio,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Variáveis do Supabase local e admin de teste
        working-directory: la-dolce-api
        run: |
          eval "$(npx supabase status -o env)"
          password="Aa1-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } > ../la-dolce-app/.env.local
          ADMIN_PASSWORD="$password" npm run admin:create -- --email e2e@ci.local
          echo "E2E_ADMIN_EMAIL=e2e@ci.local" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            la-dolce-app/playwright-report/
            la-dolce-app/test-results/
          retention-days: 7
      - if: always()
        working-directory: la-dolce-api
        run: npx supabase stop --no-backup
